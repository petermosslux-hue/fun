<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brickfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --case:#cdcfca; --case-edge:#b4b7b1; --bezel:#565a6b; --ink:#3b3f58;
  --dpad:#24262b; --dpad-hi:#3a3d45; --pill:#8a8d94; --ab:#8b2557; --ab-hi:#a83a70;
  --l0:#c9d38c; --l1:#97a955; --l2:#4c6a3b; --l3:#1c3324;
  --k:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --case:#2a2c33; --case-edge:#1d1f24; --bezel:#111216; --ink:#a9adb8;
    --dpad:#121317; --dpad-hi:#30333b; --pill:#555963; --ab:#9c2f66; --ab-hi:#b8477f;
  }
}
:root[data-theme="dark"]{
  --case:#2a2c33; --case-edge:#1d1f24; --bezel:#111216; --ink:#a9adb8;
  --dpad:#121317; --dpad-hi:#30333b; --pill:#555963; --ab:#9c2f66; --ab-hi:#b8477f;
}
@media (max-height:640px){ :root{ --k:.84; } }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  height:100%; margin:0; background:var(--case); color:var(--ink);
  overflow:hidden; overscroll-behavior:none; touch-action:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
.console{height:100%; max-width:460px; margin:0 auto; display:flex; flex-direction:column}

/* screen */
.stage{flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px 0 0}
.bezel{background:var(--bezel); padding:12px; border-radius:10px 10px 34px 10px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.lcd{
  --u:2px; position:relative; display:flex; width:calc(var(--u)*160); height:calc(var(--u)*144);
  background:var(--l0); color:var(--l3); overflow:hidden;
  font-family:"Silkscreen","Courier New",monospace; font-size:calc(var(--u)*8); line-height:1;
}
.lcd canvas{display:block}
.side{flex:1; padding:calc(var(--u)*4) calc(var(--u)*4) 0; display:flex; flex-direction:column; gap:calc(var(--u)*4)}
.stat{display:flex; flex-direction:column; gap:calc(var(--u)*1)}
.stat b{font-weight:400; text-align:right; background:var(--l1); padding:calc(var(--u)*1) calc(var(--u)*2) calc(var(--u)*2)}
.nextbox{align-self:center; border:calc(var(--u)*1) solid var(--l3); padding:calc(var(--u)*1)}
.overlay{
  position:absolute; inset:0; background:var(--l0); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:calc(var(--u)*7); text-align:center; padding:calc(var(--u)*6);
}
.overlay[hidden]{display:none}
.overlay h1{margin:0; font-size:calc(var(--u)*16); font-weight:700; letter-spacing:calc(var(--u)*-.5)}
.overlay p{margin:0}
.overlay .pick{background:var(--l3); color:var(--l0); padding:calc(var(--u)*2) calc(var(--u)*5) calc(var(--u)*3)}
.overlay .dim{color:var(--l2); font-size:calc(var(--u)*6); line-height:1.5}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{visibility:hidden}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}

/* controls */
.controls{
  flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; align-items:center;
  padding:calc(var(--k)*16px) 20px calc(var(--k)*8px); row-gap:calc(var(--k)*2px);
}
button{font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; touch-action:none; cursor:pointer}
button:focus-visible{outline:2px solid var(--ink); outline-offset:3px; border-radius:8px}
.lbl{font-weight:800; font-style:italic; font-size:12px; letter-spacing:.04em; color:var(--ink)}

.dpad{justify-self:start; position:relative; width:calc(var(--k)*146px); height:calc(var(--k)*146px); touch-action:none}
.arm{position:absolute; background:var(--dpad); box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.arm.h{left:0; right:0; top:34%; bottom:34%; border-radius:7px}
.arm.v{top:0; bottom:0; left:34%; right:34%; border-radius:7px}
.hit{position:absolute; width:32%; height:32%; border-radius:6px}
.hit.up{left:34%; top:1%} .hit.down{left:34%; bottom:1%}
.hit.left{top:34%; left:1%} .hit.right{top:34%; right:1%}
.dpad[data-dir="up"] .hit.up,.dpad[data-dir="down"] .hit.down,
.dpad[data-dir="left"] .hit.left,.dpad[data-dir="right"] .hit.right{background:var(--dpad-hi)}
.hub{position:absolute; left:41%; top:41%; width:18%; height:18%; border-radius:50%; background:rgba(0,0,0,.28)}

.ab{justify-self:end; position:relative; width:calc(var(--k)*160px); height:calc(var(--k)*136px)}
.round{position:absolute; display:flex; flex-direction:column; align-items:center; gap:4px; width:calc(var(--k)*72px)}
.round .cap{
  width:calc(var(--k)*72px); height:calc(var(--k)*72px); border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--ab-hi), var(--ab) 60%);
  box-shadow:0 3px 0 rgba(0,0,0,.28);
}
.round.is-down .cap{transform:translateY(3px); box-shadow:none; filter:brightness(.85)}
.round[data-key="b"]{left:0; top:calc(var(--k)*40px)}
.round[data-key="a"]{right:0; top:0}

.meta{grid-column:1/-1; display:flex; justify-content:center; gap:10px}
.pill{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; width:78px; height:calc(var(--k)*50px)}
.pill .cap{width:54px; height:15px; border-radius:8px; background:var(--pill); transform:rotate(-24deg); box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pill.is-down .cap{transform:rotate(-24deg) translateY(2px); box-shadow:none; filter:brightness(.85)}
</style>
</head>
<body>
<main class="console">
  <div class="stage" id="stage">
    <div class="bezel">
      <div class="lcd" id="lcd">
        <canvas id="field" aria-label="Playfield"></canvas>
        <div class="side">
          <div class="stat"><span>Score</span><b id="score">0</b></div>
          <div class="stat"><span>Level</span><b id="level">0</b></div>
          <div class="stat"><span>Lines</span><b id="lines">0</b></div>
          <div class="stat"><span>Next</span><div class="nextbox"><canvas id="next"></canvas></div></div>
        </div>
        <div class="overlay" id="overlay"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="dpad" id="dpad" role="group" aria-label="Direction pad">
      <div class="arm h"></div><div class="arm v"></div>
      <div class="hit up"></div><div class="hit down"></div><div class="hit left"></div><div class="hit right"></div>
      <div class="hub"></div>
    </div>
    <div class="ab">
      <button class="round" data-key="b" aria-label="B, turn left"><span class="cap"></span><span class="lbl">B</span></button>
      <button class="round" data-key="a" aria-label="A, turn right"><span class="cap"></span><span class="lbl">A</span></button>
    </div>
    <div class="meta">
      <button class="pill" data-key="select" aria-label="Select, show or hide next piece"><span class="cap"></span><span class="lbl">Select</span></button>
      <button class="pill" data-key="start" aria-label="Start or pause"><span class="cap"></span><span class="lbl">Start</span></button>
    </div>
  </div>
</main>

<script>
(function(){
'use strict';

/* ---------- constants: original handheld timings (59.73 fps) ---------- */
var FRAME = 1000/59.73;
var GRAVITY = [53,49,45,41,37,33,28,22,17,11,10,9,8,7,6,6,5,5,4,4,3]; // frames per row, levels 0-20
var LINE_SCORE = [0,40,100,300,1200];
var DAS_DELAY = 23, DAS_REPEAT = 9, SOFT_FRAMES = 3, CLEAR_FRAMES = 48;
var COLS = 10, ROWS = 18;
var SHADE = ['#c9d38c','#97a955','#4c6a3b','#1c3324'];

/* ---------- pieces (no wall kicks, as in the original) ---------- */
function spin(cells){ return cells.map(function(c){ return [2-c[1], c[0]]; }); }
function four(cells){ var a=[cells]; for(var i=0;i<3;i++) a.push(spin(a[i])); return a; }
var SHAPES = [
  [[[0,1],[1,1],[2,1],[3,1]], [[1,0],[1,1],[1,2],[1,3]]],              // I
  [[[1,1],[2,1],[1,2],[2,2]]],                                          // O
  four([[0,1],[1,1],[2,1],[1,2]]),                                      // T
  [[[1,1],[2,1],[0,2],[1,2]], [[0,0],[0,1],[1,1],[1,2]]],              // S
  [[[0,1],[1,1],[1,2],[2,2]], [[1,0],[0,1],[1,1],[0,2]]],              // Z
  four([[0,1],[1,1],[2,1],[2,2]]),                                      // J
  four([[0,1],[1,1],[2,1],[0,2]])                                       // L
];
var TILES = [
  ['33333333','31111113','31212123','31121213','31212123','31121213','31111113','33333333'],
  ['33333333','30000003','30333303','30300303','30300303','30333303','30000003','33333333'],
  ['33333333','31111113','31000013','31011013','31011013','31000013','31111113','33333333'],
  ['33333333','32222223','32222223','32200223','32200223','32222223','32222223','33333333'],
  ['33333333','30111113','31111123','31111123','31111123','31111123','31222223','33333333'],
  ['33333333','32222223','32333323','32333323','32333323','32333323','32222223','33333333'],
  ['33333333','30101013','31010103','30101013','31010103','30101013','31010103','33333333'],
  ['11131113','11131113','11131113','33333333','13111311','13111311','13111311','33333333']  // wall
];
var WALL = 7;

/* ---------- elements ---------- */
var $ = function(id){ return document.getElementById(id); };
var stage=$('stage'), lcd=$('lcd'), field=$('field'), nextC=$('next'), overlay=$('overlay');
var fctx=field.getContext('2d'), nctx=nextC.getContext('2d');
var elScore=$('score'), elLevel=$('level'), elLines=$('lines');
var n=2, tileCache=[];

function resize(){
  var dpr = window.devicePixelRatio||1;
  var w = stage.clientWidth-24, h = stage.clientHeight-32;
  n = Math.max(1, Math.floor(Math.min(w*dpr/160, h*dpr/144)));
  var u = n/dpr;
  lcd.style.setProperty('--u', u+'px');
  field.width=96*n; field.height=144*n; field.style.width=(96*u)+'px'; field.style.height=(144*u)+'px';
  nextC.width=32*n; nextC.height=32*n; nextC.style.width=(32*u)+'px'; nextC.style.height=(32*u)+'px';
  tileCache = TILES.map(function(rows){
    var c=document.createElement('canvas'); c.width=c.height=8*n;
    var x=c.getContext('2d');
    for(var r=0;r<8;r++) for(var k=0;k<8;k++){ x.fillStyle=SHADE[+rows[r][k]]; x.fillRect(k*n,r*n,n,n); }
    return c;
  });
  dirty=true;
}

/* ---------- storage ---------- */
function load(k,d){ try{ var v=localStorage.getItem('brickfall.'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem('brickfall.'+k, JSON.stringify(v)); }catch(e){} }

/* ---------- sound ---------- */
var ac=null, sound=load('sound',true);
function wake(){
  try{
    if(!ac){ var A=window.AudioContext||window.webkitAudioContext; if(A) ac=new A(); }
    if(ac && ac.state==='suspended') ac.resume();
  }catch(e){}
}
function tone(f,at,d,v){
  if(!sound||!ac) return;
  try{
    var t=ac.currentTime+at, o=ac.createOscillator(), g=ac.createGain();
    o.type='square'; o.frequency.value=f;
    g.gain.setValueAtTime(v||.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}
var sfx={
  move:function(){ tone(196,0,.04,.03); },
  turn:function(){ tone(392,0,.05,.04); },
  lock:function(){ tone(98,0,.09,.06); },
  line:function(){ tone(523,0,.08); tone(659,.08,.08); tone(784,.16,.14); },
  four:function(){ [523,659,784,1047,784,1047,1319].forEach(function(f,i){ tone(f,i*.07,.1); }); },
  level:function(){ tone(659,0,.08); tone(988,.09,.18); },
  over:function(){ [392,330,262,196,131].forEach(function(f,i){ tone(f,i*.16,.2,.06); }); }
};

/* ---------- input ---------- */
var held={}, edge={};
function press(k){ wake(); if(!held[k]){ held[k]=true; edge[k]=true; } }
function release(k){ held[k]=false; }

Array.prototype.forEach.call(document.querySelectorAll('button[data-key]'), function(b){
  var k=b.dataset.key;
  b.addEventListener('pointerdown', function(e){ e.preventDefault(); try{ b.setPointerCapture(e.pointerId); }catch(_){} b.classList.add('is-down'); press(k); });
  var up=function(){ b.classList.remove('is-down'); release(k); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
  b.addEventListener('contextmenu', function(e){ e.preventDefault(); });
});

var dpad=$('dpad'), padDir=null, padPtr=null;
function setPad(d){
  if(d===padDir) return;
  if(padDir) release(padDir);
  padDir=d;
  if(d){ press(d); dpad.dataset.dir=d; } else delete dpad.dataset.dir;
}
function padFrom(e){
  var r=dpad.getBoundingClientRect(), dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  if(Math.sqrt(dx*dx+dy*dy) < r.width*.1) return padDir;      // dead zone keeps the last direction
  return Math.abs(dx)>Math.abs(dy) ? (dx<0?'left':'right') : (dy<0?'up':'down');
}
dpad.addEventListener('pointerdown', function(e){ e.preventDefault(); padPtr=e.pointerId; try{ dpad.setPointerCapture(e.pointerId); }catch(_){} setPad(padFrom(e)); });
dpad.addEventListener('pointermove', function(e){ if(e.pointerId===padPtr) setPad(padFrom(e)); });
function padUp(e){ if(e.pointerId===padPtr){ padPtr=null; setPad(null); } }
dpad.addEventListener('pointerup', padUp); dpad.addEventListener('pointercancel', padUp);

var KEYS={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'a',x:'a',X:'a',z:'b',Z:'b',Enter:'start',Shift:'select'};
addEventListener('keydown', function(e){ var k=KEYS[e.key]; if(k){ e.preventDefault(); if(!e.repeat) press(k); } });
addEventListener('keyup', function(e){ var k=KEYS[e.key]; if(k) release(k); });
document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ---------- game state ---------- */
var state='title', dirty=true;
var board, cur, next, last=-1, showNext=true;
var score, lines, level, startLevel=load('level',0), top=load('top',0);
var dropT, das, hdir, softCount, downLock, clearRows, clearT, spawnT, overT, curtain;

function rand(){ var t=Math.floor(Math.random()*7); if(t===last) t=Math.floor(Math.random()*7); last=t; return t; }
function fits(t,r,px,py){
  var s=SHAPES[t][r];
  for(var i=0;i<4;i++){
    var x=px+s[i][0], y=py+s[i][1];
    if(x<0||x>=COLS||y>=ROWS) return false;
    if(y>=0 && board[y][x]) return false;
  }
  return true;
}
function hud(){
  elScore.textContent=score; elLevel.textContent=level; elLines.textContent=lines;
}
function drawNext(){
  nctx.fillStyle=SHADE[0]; nctx.fillRect(0,0,nextC.width,nextC.height);
  if(next==null || !showNext || state==='title') return;
  var s=SHAPES[next][0], x0=9,x1=0,y0=9,y1=0;
  s.forEach(function(c){ x0=Math.min(x0,c[0]); x1=Math.max(x1,c[0]); y0=Math.min(y0,c[1]); y1=Math.max(y1,c[1]); });
  var ox=(32-(x1-x0+1)*8)/2 - x0*8, oy=(32-(y1-y0+1)*8)/2 - y0*8;
  s.forEach(function(c){ nctx.drawImage(tileCache[next], (ox+c[0]*8)*n, (oy+c[1]*8)*n); });
}
function draw(){
  var T=8*n, r, c;
  fctx.fillStyle=SHADE[0]; fctx.fillRect(0,0,field.width,field.height);
  for(r=0;r<ROWS;r++){ fctx.drawImage(tileCache[WALL],0,r*T); fctx.drawImage(tileCache[WALL],11*T,r*T); }
  if(board){
    for(r=0;r<ROWS;r++) for(c=0;c<COLS;c++) if(board[r][c]) fctx.drawImage(tileCache[board[r][c]-1],(c+1)*T,r*T);
    if(cur){
      SHAPES[cur.t][cur.r].forEach(function(p){
        var y=cur.y+p[1]; if(y>=0) fctx.drawImage(tileCache[cur.t],(cur.x+p[0]+1)*T,y*T);
      });
    }
    if(clearRows && Math.floor(clearT/8)%2===1){
      fctx.fillStyle=SHADE[1];
      clearRows.forEach(function(row){ fctx.fillRect(T,row*T,COLS*T,T); });
    }
    for(r=ROWS-curtain;r<ROWS;r++) for(c=0;c<COLS;c++) fctx.drawImage(tileCache[WALL],(c+1)*T,r*T);
  }
  drawNext();
}

function screen(html){ if(html===null){ overlay.hidden=true; } else { overlay.innerHTML=html; overlay.hidden=false; } }
function titleScreen(){
  state='title';
  screen('<h1>Brickfall</h1>'+
    '<p class="pick">Level &lt; '+startLevel+' &gt;</p>'+
    '<p>Top '+top+'</p>'+
    '<p class="blink">Press Start</p>'+
    '<p class="dim">Left / right picks level<br>B turns sound '+(sound?'off':'on')+'</p>');
}

function newGame(){
  board=[]; for(var r=0;r<ROWS;r++){ board.push(new Array(COLS).fill(0)); }
  score=0; lines=0; level=startLevel; curtain=0; clearRows=null; cur=null; showNext=true;
  last=-1; next=rand(); state='play'; screen(null); spawn(); hud(); dirty=true;
}
function spawn(){
  cur={t:next,r:0,x:3,y:-1}; next=rand();
  dropT=0; softCount=0; downLock=!!held.down; dirty=true;
  if(!fits(cur.t,cur.r,cur.x,cur.y)) gameOver();
}
function gameOver(){
  state='over'; overT=0; sfx.over();
  if(score>top){ top=score; save('top',top); }
}
function lock(){
  SHAPES[cur.t][cur.r].forEach(function(p){ var y=cur.y+p[1]; if(y>=0) board[y][cur.x+p[0]]=cur.t+1; });
  score=Math.min(999999, score+softCount); softCount=0; downLock=!!held.down;
  cur=null;
  var full=[];
  for(var r=0;r<ROWS;r++) if(board[r].every(Boolean)) full.push(r);
  if(full.length){ clearRows=full; clearT=CLEAR_FRAMES; (full.length===4?sfx.four:sfx.line)(); }
  else { spawnT=2; sfx.lock(); }
  hud(); dirty=true;
}
function collapse(){
  var k=clearRows.length;
  clearRows.forEach(function(r){ board.splice(r,1); board.unshift(new Array(COLS).fill(0)); });
  clearRows=null; lines+=k;
  score=Math.min(999999, score+LINE_SCORE[k]*(level+1));
  var before=level;
  while(level<20 && lines>=(level+1)*10) level++;
  if(level>before) sfx.level();
  hud();
}
function shift(d){ if(fits(cur.t,cur.r,cur.x+d,cur.y)){ cur.x+=d; sfx.move(); dirty=true; } }
function turn(d){
  var k=SHAPES[cur.t].length, r=(cur.r+d+k)%k;
  if(k>1 && fits(cur.t,r,cur.x,cur.y)){ cur.r=r; sfx.turn(); dirty=true; }
}

function stepPlay(){
  if(edge.start){ state='pause'; screen('<h1>Paused</h1><p class="blink">Press Start</p>'); return; }
  if(edge.select){ showNext=!showNext; dirty=true; }
  if(clearRows){
    clearT--; if(clearT%8===7||clearT===0) dirty=true;
    if(clearT<=0){ collapse(); spawn(); }
    return;
  }
  if(!cur){ if(--spawnT<=0) spawn(); return; }

  if(edge.a) turn(1);
  if(edge.b) turn(-1);

  var d=0;
  if(edge.left) d=-1; else if(edge.right) d=1;
  if(d){ hdir=d; das=0; shift(d); }
  else if(!!held.left!==!!held.right){
    d=held.left?-1:1;
    if(d!==hdir){ hdir=d; das=0; shift(d); }
    else if(++das>=DAS_DELAY){ das=DAS_DELAY-DAS_REPEAT; shift(d); }
  } else hdir=0;

  if(!held.down){ downLock=false; softCount=0; }
  var soft=held.down && !downLock;
  var speed=soft ? Math.min(SOFT_FRAMES,GRAVITY[level]) : GRAVITY[level];
  if(++dropT>=speed){
    dropT=0;
    if(fits(cur.t,cur.r,cur.x,cur.y+1)){ cur.y++; if(soft) softCount++; dirty=true; }
    else lock();
  }
}
function step(){
  if(state==='play') stepPlay();
  else if(state==='title'){
    if(edge.left){ startLevel=(startLevel+9)%10; save('level',startLevel); titleScreen(); sfx.move(); }
    if(edge.right){ startLevel=(startLevel+1)%10; save('level',startLevel); titleScreen(); sfx.move(); }
    if(edge.b){ sound=!sound; save('sound',sound); titleScreen(); sfx.turn(); }
    if(edge.start||edge.a) newGame();
  }
  else if(state==='pause'){ if(edge.start){ state='play'; screen(null); dirty=true; } }
  else if(state==='over'){
    overT++;
    var c=Math.min(ROWS, Math.floor(overT/3));
    if(c!==curtain){ curtain=c; dirty=true; }
    if(overT===ROWS*3+30){
      screen('<h1>Game over</h1><p>Score '+score+'</p><p>Top '+top+'</p><p class="blink">Press Start</p>');
    }
    if(overT>ROWS*3+30 && (edge.start||edge.a)){ board=null; curtain=0; next=null; titleScreen(); dirty=true; }
  }
  edge={};
}

/* ---------- loop ---------- */
var prev=0, acc=0;
function loop(t){
  var dt=Math.min(250, t-prev); prev=t; acc+=dt;
  while(acc>=FRAME){ step(); acc-=FRAME; }
  if(dirty){ draw(); dirty=false; }
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', function(){
  if(document.hidden && state==='play'){ state='pause'; screen('<h1>Paused</h1><p class="blink">Press Start</p>'); }
  held={}; setPad(null);
});
addEventListener('resize', resize);
if(window.ResizeObserver) new ResizeObserver(resize).observe(stage);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ dirty=true; });

curtain=0; resize(); titleScreen();
requestAnimationFrame(function(t){ prev=t; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
