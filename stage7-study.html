<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stage 7 Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}
/* Layout: one centred column; squared exercise-book paper behind, white question sheets with a red margin rule on top. */
:root {
  --paper: #f3f6fa;
  --rule: rgba(64, 104, 168, 0.10);
  --sheet: #ffffff;
  --ink: #1c2740;
  --ink-2: #56627c;
  --line: #d6dde9;
  --accent: #2851a3;
  --accent-ink: #ffffff;
  --accent-soft: #e3eaf8;
  --pen: #c42f2a;
  --pen-soft: #fbe6e4;
  --ok: #26754a;
  --ok-soft: #e1f1e7;
  --hl: #fff0a0;
  --margin: #eba5a1;
  --fig-fill: #eef2f9;
  --fig-fill-2: #dfe6f3;
  --fig-fill-3: #ccd7ea;
  --img: #13806f;
  --img-soft: rgba(19, 128, 111, 0.18);
  --sN: #2851a3; --sA: #7445c0; --sG: #13806f; --sS: #b5700c;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121822; --rule: rgba(150, 185, 245, 0.06); --sheet: #1a2230; --ink: #e8edf6; --ink-2: #9ba7be; --line: #2d3849;
    --accent: #93b2f6; --accent-ink: #0e1626; --accent-soft: #223152; --pen: #ff8b81; --pen-soft: #3b2426; --ok: #7fd5a1; --ok-soft: #1c3327;
    --hl: #4a421a; --margin: #6e3b3b; --fig-fill: #222c3d; --fig-fill-2: #2a3549; --fig-fill-3: #334058; --img: #5fd0bd; --img-soft: rgba(95, 208, 189, 0.2);
    --sN: #93b2f6; --sA: #b99af0; --sG: #5fd0bd; --sS: #f0b65a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121822; --rule: rgba(150, 185, 245, 0.06); --sheet: #1a2230; --ink: #e8edf6; --ink-2: #9ba7be; --line: #2d3849;
  --accent: #93b2f6; --accent-ink: #0e1626; --accent-soft: #223152; --pen: #ff8b81; --pen-soft: #3b2426; --ok: #7fd5a1; --ok-soft: #1c3327;
  --hl: #4a421a; --margin: #6e3b3b; --fig-fill: #222c3d; --fig-fill-2: #2a3549; --fig-fill-3: #334058; --img: #5fd0bd; --img-soft: rgba(95, 208, 189, 0.2);
  --sN: #93b2f6; --sA: #b99af0; --sG: #5fd0bd; --sS: #f0b65a; color-scheme: dark;
}
html { height: 100%; }
body {
  min-height: 100%; margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  background-color: var(--paper);
  background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 24px 24px;
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; }

/* masthead */
.mast { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; margin-bottom: 18px; border-bottom: 2px solid var(--ink); }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.7rem; letter-spacing: -0.02em; line-height: 1; margin: 0; }
.brand span { color: var(--accent); }
.subjects { display: flex; gap: 6px; }
.subj { border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 999px; padding: 3px 12px; font-size: 0.85rem; font-weight: 700; }
.mastmeta { font-size: 0.85rem; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }

h1, h2, h3 { font-family: var(--f-display); letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
h1 { font-size: 1.85rem; font-weight: 800; line-height: 1.1; }
h2 { font-size: 1.3rem; font-weight: 800; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 0.85rem; color: var(--ink-2); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* buttons */
.btn { border: 2px solid var(--ink); background: var(--sheet); border-radius: 999px; padding: 9px 18px; font-weight: 700; line-height: 1.2; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 3px; padding-inline: 4px; }
.btn.quiet:hover { background: transparent; color: var(--accent); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.back { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; }
.back::before { content: "\2190\00a0"; }

/* next-up card */
.next { background: var(--sheet); border: 2px solid var(--ink); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; box-shadow: 4px 4px 0 var(--ink); }
.next .lab { font-size: 0.8rem; font-weight: 700; color: var(--ink-2); }
.next h2 { font-size: 1.35rem; }
.tally { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.92rem; color: var(--ink-2); }
.tally b { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 1.05rem; }

/* strands and topics */
.strand { display: grid; gap: 8px; }
.strandhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-top: 10px; }
.strandhead h2 { display: flex; align-items: center; gap: 10px; }
.strandhead h2::before { content: ""; width: 14px; height: 14px; border-radius: 3px; background: var(--sc); flex: none; }
.topics { display: grid; gap: 6px; }
.trow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; width: 100%; text-align: left; background: var(--sheet); border: 1px solid var(--line); border-left: 4px solid var(--sc); border-radius: 8px; padding: 10px 14px; }
.trow:hover { border-color: var(--sc); }
.trow .tt { font-weight: 700; min-width: 0; }
.trow .codes { font-size: 0.78rem; color: var(--ink-2); grid-column: 1; }
.trow .st { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.meter { display: flex; gap: 3px; }
.meter i { width: 16px; height: 7px; border-radius: 2px; background: var(--line); }
.meter[data-l="1"] i:nth-child(-n+1), .meter[data-l="2"] i:nth-child(-n+2), .meter[data-l="3"] i { background: var(--sc, var(--accent)); }
.stl { font-size: 0.75rem; color: var(--ink-2); white-space: nowrap; }
.stl[data-l="3"] { color: var(--ok); font-weight: 700; }

/* topic page */
.topichead { display: grid; gap: 8px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 0.78rem; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--sheet); color: var(--ink-2); }
.chip.calc { border-color: var(--ink); color: var(--ink); font-weight: 700; }
.chip.nocalc { border-style: dashed; }
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); }
.tab { border: 0; background: none; padding: 8px 14px; font-weight: 700; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.ideas { margin: 0; padding-left: 1.2em; display: grid; gap: 10px; max-width: 65ch; }
.ideas li::marker { color: var(--accent); }

/* the sheet: question paper with margin rule */
.sheet { position: relative; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 18px 18px 64px; display: grid; gap: 14px; box-shadow: 0 1px 0 var(--line); }
.sheet::before { content: ""; position: absolute; top: 0; bottom: 0; left: 48px; width: 2px; background: var(--margin); }
.sheet .qn { position: absolute; left: 0; top: 16px; width: 48px; text-align: center; font-family: var(--f-hand); font-size: 1.6rem; font-weight: 700; color: var(--ink-2); line-height: 1; }
.sheet .mark { position: absolute; left: 2px; top: 46px; width: 44px; text-align: center; font-family: var(--f-hand); font-size: 2.6rem; font-weight: 700; line-height: 1; transform: rotate(-8deg); }
.sheet .mark.ok { color: var(--ok); }
.sheet .mark.no { color: var(--pen); }
@media (prefers-reduced-motion: no-preference) { .sheet .mark { animation: ink 0.28s ease-out; } @keyframes ink { from { opacity: 0; transform: rotate(-20deg) scale(1.5); } } }
.ex .sheet { padding-left: 18px; }
.ex .sheet::before { display: none; }
.watch { border-left: 3px solid var(--pen); padding: 6px 0 6px 12px; max-width: 65ch; }
.watch b { color: var(--pen); }
.prompt { font-size: 1.08rem; max-width: 65ch; }
.prompt p + p, .prompt .data { margin-top: 6px; }
.figwrap { overflow-x: auto; }
.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; }
.calcnote { font-size: 0.8rem; font-weight: 700; color: var(--ink-2); }

/* answers */
.answers { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
.field { display: flex; align-items: center; gap: 8px; }
.field label { font-weight: 700; white-space: nowrap; }
.inp { width: 9.5em; max-width: 100%; border: 2px solid var(--ink-2); border-radius: 8px; padding: 8px 10px; background: var(--sheet); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.inp:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.inp.ok { border-color: var(--ok); background: var(--ok-soft); }
.inp.no { border-color: var(--pen); background: var(--pen-soft); }
.seg { display: inline-flex; border: 2px solid var(--ink-2); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--sheet); padding: 7px 13px; font-size: 1.15rem; min-width: 44px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
.seg.ok { border-color: var(--ok); } .seg.no { border-color: var(--pen); }
.keys { display: flex; gap: 6px; flex-wrap: wrap; }
.keys button { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 4px 10px; font-size: 0.95rem; min-width: 40px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; border: 2px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 10px 12px; width: 100%; }
.opt::before { content: ""; flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink-2); }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-checked="true"]::before { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 45%, transparent 50%); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--pen); background: var(--pen-soft); }
.opt:disabled { cursor: default; color: var(--ink); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.hintbox { background: var(--hl); border-radius: 6px; padding: 8px 12px; max-width: 65ch; }
.feedback { display: grid; gap: 10px; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--ok); }
.verdict.no { color: var(--pen); }
.warn { color: var(--pen); font-weight: 700; }
details.sol { border-top: 1px dashed var(--line); padding-top: 10px; }
details.sol summary { cursor: pointer; font-weight: 700; color: var(--accent); }
details.sol .steps { margin-top: 8px; }

/* progress dots */
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); }
.dots i.cur { border-color: var(--ink); }
.dots i.ok { background: var(--ok); border-color: var(--ok); }
.dots i.no { background: var(--pen); border-color: var(--pen); }
.dots i.done { background: var(--ink-2); border-color: var(--ink-2); }
.practhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

/* results */
.score { font-family: var(--f-hand); font-size: 4rem; font-weight: 700; line-height: 0.9; color: var(--pen); transform: rotate(-4deg); display: inline-block; }
.review { display: grid; gap: 10px; }
.rv { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; }
.rv .rvh { display: flex; gap: 10px; align-items: baseline; }
.rv .m { font-family: var(--f-hand); font-size: 1.6rem; font-weight: 700; line-height: 1; }
.rv .m.ok { color: var(--ok); } .rv .m.no { color: var(--pen); }

/* test setup */
.choice { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.choice button { text-align: left; border: 2px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 10px 12px; font-weight: 700; }
.choice button[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice button span { display: block; font-weight: 400; font-size: 0.8rem; color: var(--ink-2); }

footer { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; font-size: 0.82rem; color: var(--ink-2); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* maths typography */
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: 0.92em; line-height: 1.15; margin: 0 0.12em; }
.fr > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 0.2em 1px; }
.fr > span:last-child { padding: 1px 0.2em 0; }
.ov { border-top: 1.5px solid currentColor; padding: 0 0.1em; margin-left: 1px; }
.rec { text-decoration: overline; text-decoration-thickness: 1.5px; }
.vec { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.1; padding: 1px 6px; border-left: 1.5px solid currentColor; border-right: 1.5px solid currentColor; border-radius: 8px; margin: 0 2px; font-size: 0.92em; }
.blank { display: inline-block; min-width: 1.2em; border: 1.5px dashed var(--ink-2); border-radius: 3px; text-align: center; font-size: 0.8em; }
sup { font-size: 0.7em; line-height: 0; }
i { font-family: "Times New Roman", Georgia, serif; font-size: 1.08em; }
.quote { display: block; font-style: italic; padding: 6px 0 6px 12px; border-left: 3px solid var(--line); margin: 6px 0; }
.data { font-variant-numeric: tabular-nums; font-size: 1.1rem; letter-spacing: 0.02em; }
.eqs { display: grid; gap: 4px; margin-top: 8px; padding-left: 12px; border-left: 3px solid var(--line); font-size: 1.12rem; }
.machine { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.mbox { border: 2px solid var(--ink); border-radius: 6px; padding: 6px 12px; font-weight: 700; background: var(--fig-fill); }
.mio { font-weight: 700; min-width: 2em; text-align: center; font-variant-numeric: tabular-nums; }
.arrow { color: var(--ink-2); }
.tblwrap { overflow-x: auto; margin-top: 10px; }
table.dt { border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.dt th, table.dt td { border: 1px solid var(--line); padding: 5px 12px; text-align: center; }
table.dt thead th { background: var(--fig-fill); }
table.dt tbody th { text-align: left; font-weight: 700; }
table.stem td:last-child { text-align: left; letter-spacing: 0.35em; }

/* svg figures */
svg.fig { display: block; max-width: 100%; height: auto; }
svg.fig .gl { stroke: var(--line); stroke-width: 1; }
svg.fig .axis { stroke: var(--ink); stroke-width: 1.5; }
svg.fig .ln { stroke: var(--ink); stroke-width: 1.8; fill: none; }
svg.fig .dim { stroke: var(--ink-2); stroke-width: 1.4; stroke-dasharray: 4 3; }
svg.fig .dash { stroke: var(--ink-2); stroke-width: 1.2; stroke-dasharray: 4 3; }
svg.fig .shape { fill: var(--fig-fill); stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; }
svg.fig .shape2 { fill: var(--fig-fill-2); stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; }
svg.fig .shape3 { fill: var(--fig-fill-3); stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; }
svg.fig .hole { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.8; }
svg.fig .plot { stroke: var(--accent); stroke-width: 2.6; fill: none; }
svg.fig .plot2 { stroke: var(--img); stroke-width: 2.6; fill: none; }
svg.fig .obj { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
svg.fig .img { fill: var(--img-soft); stroke: var(--img); stroke-width: 2; }
svg.fig .dot { fill: var(--ink); }
svg.fig .cross { stroke: var(--ink); stroke-width: 1.6; }
svg.fig text { fill: var(--ink); font-family: var(--f-body); }
svg.fig .lbl { font-size: 13px; }
svg.fig .strong { font-size: 15px; font-weight: 700; }
svg.fig .tick { font-size: 10px; fill: var(--ink-2); }
svg.fig .axl { font-size: 12px; fill: var(--ink-2); }
svg.fig .shlbl { font-size: 13px; font-weight: 700; }

@media (max-width: 520px) {
  body { font-size: 16px; }
  .brand { font-size: 1.45rem; }
  h1 { font-size: 1.55rem; }
  .sheet { padding: 14px 14px 14px 50px; }
  .sheet::before { left: 38px; }
  .sheet .qn { width: 38px; font-size: 1.35rem; }
  .sheet .mark { width: 36px; font-size: 2.2rem; left: 1px; }
  .inp { width: 7.5em; }
}
.sheet > *, .stack > *, .feedback > *, .rv > * { min-width: 0; }
</style></head><body>
<div class="wrap">
  <header class="mast">
    <div class="stack" style="gap:8px">
      <p class="brand">Stage 7 <span>Study</span></p>
      <div class="subjects" aria-label="Subject"><span class="subj">Maths</span></div>
    </div>
    <p class="mastmeta" id="mastmeta"></p>
  </header>
  <main id="view"></main>
  <footer>
    <p>Topics follow the Cambridge Lower Secondary Mathematics curriculum framework (0862), Stage 7. Every question is generated fresh, so you can practise as often as you like.</p>
    <p id="syncnote"></p>
    <div class="confirm"><button class="btn quiet" id="reset" type="button">Reset my progress</button>
      <span id="confirm" hidden class="confirm"><span>This clears every topic score. Reset?</span><button class="btn" id="yesreset" type="button">Yes, reset</button><button class="btn quiet" id="nokeep" type="button">Keep my progress</button></span></div>
  </footer>
</div>
<script>
/* ===== core helpers (no DOM) ===== */
var MINUS = '−';
function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function nz(a, b) { var x; do { x = ri(a, b); } while (x === 0); return x; }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; }
function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }
function clean(x) { return +(+x).toPrecision(12); }

function fmt(x, dp) {
  var s;
  if (dp != null) s = (Math.round(x * Math.pow(10, dp)) / Math.pow(10, dp)).toFixed(dp);
  else { s = clean(x).toFixed(12).replace(/0+$/, '').replace(/\.$/, ''); }
  if (s === '-0') s = '0';
  var neg = s.charAt(0) === '-'; if (neg) s = s.slice(1);
  var parts = s.split('.');
  if (parts[0].length > 4) parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? MINUS : '') + parts.join('.');
}
function sn(n, dp) { return fmt(n, dp); }
function money(x) { return '€' + (Math.abs(x - Math.round(x)) < 1e-9 ? fmt(Math.round(x)) : fmt(x, 2)); }
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

/* rationals */

  function respText(q, resp) {
    if (q.kind === 'mc') return resp == null ? '(no answer)' : q.options[resp];
    if (q.kind === 'fields') return q.fields.map(function (f, i) { var r = resp[i]; if (f.kind === 'select') { var o = (f.options || []).filter(function (x) { return x[0] === r; })[0]; return (f.label || '') + ' ' + (o ? o[1] : '?'); } return (f.label ? f.label + ' ' : '') + (r && String(r).trim() ? escapeHTML(r) : '?'); }).join(', ');
    return resp && String(resp).trim() ? escapeHTML(resp) : '(no answer)';
  }
  function escapeHTML(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* question making, with variety and no repeats */
  function maker(topicIds) {
    var seen = {}, queues = {};
    return function (id) {
      var t = byId[id];
      if (!queues[id] || !queues[id].length) queues[id] = shuffle(t.gens.map(function (_, i) { return i; }));
      var gi = queues[id].shift(), q;
      for (var k = 0; k < 12; k++) { q = t.gens[gi](); if (!seen[q.prompt]) break; }
      seen[q.prompt] = 1; q._topic = id; q._calcShow = q.calc === true || (q.calc == null && t.calc);
      return q;
    };
  }

  /* ---------- practice ---------- */
  var PRAISE = ['Correct.', 'Yes, that’s right.', 'Spot on.', 'Correct, well done.'];
  function practice(id) {
    var t = byId[id], make = maker([id]), N2 = 10, i = 0, results = [];
    current = { name: 'practice', id: id };
    function shell() {
      view.innerHTML = '<div class="stack"><div><button class="back" id="pback">' + t.title + '</button></div><div class="practhead"><h1 style="font-size:1.35rem">Practice: ' + t.title + '</h1><div class="dots" id="dots" aria-hidden="true"></div></div><p class="small" id="pcount"></p><div id="qhost"></div></div>';
      document.getElementById('pback').addEventListener('click', function () { go(function () { topicPage(id); }); });
    }
    function dots() { var d = ''; for (var k = 0; k < N2; k++) d += '<i class="' + (k < results.length ? (results[k].ok ? 'ok' : 'no') : k === i ? 'cur' : '') + '"></i>'; document.getElementById('dots').innerHTML = d; document.getElementById('pcount').textContent = 'Question ' + (i + 1) + ' of ' + N2 + (results.length ? '. ' + results.filter(function (r) { return r.ok; }).length + ' correct so far.' : '.'); }
    function next() {
      if (i >= N2) return summary();
      dots();
      var q = make(id), R2 = renderQ(q, i + 1), hinted = false, checked = false;
      var host = document.getElementById('qhost'); host.innerHTML = ''; host.appendChild(R2.box);
      var check = el('button', { class: 'btn primary', type: 'button' }, 'Check answer'), hint = el('button', { class: 'btn', type: 'button' }, 'Show a hint');
      R2.actions.appendChild(check); if (q.hint) R2.actions.appendChild(hint);
      hint.addEventListener('click', function () { hinted = true; hint.remove(); var hb = el('p', { class: 'hintbox' }, q.hint); R2.actions.parentNode.insertBefore(hb, R2.actions); });
      function doCheck() {
        if (checked) return;
        if (R2.empty()) { R2.after.innerHTML = '<p class="warn">Enter an answer first.</p>'; return; }
        var resp = R2.getResp(), m = mark(q, resp);
        if (!m.ok && q.kind !== 'mc' && (m.parts || []).some(function (p) { return p.bad && !p.blank; })) { R2.after.innerHTML = '<p class="warn">That doesn’t look like a number. You can type whole numbers, decimals, fractions like 3/4, or mixed numbers like 2 1/2.</p>'; return; }
        checked = true; R2.lock(); R2.showMarks(resp, m);
        record(id, m.ok); save(); results.push({ ok: m.ok, hinted: hinted });
        R2.markEl.textContent = m.ok ? '✓' : '✗'; R2.markEl.className = 'mark ' + (m.ok ? 'ok' : 'no');
        R2.after.innerHTML = (m.ok ? '<p class="verdict ok">' + pick(PRAISE) + (m.note ? ' ' + m.note.replace(/^Correct\. /, '') : '') + '</p>' : '<p class="verdict no">Not quite. The answer is ' + q.ans + '.</p>' + (m.note ? '<p>' + m.note + '</p>' : '')) + solutionHTML(q, !m.ok);
        check.remove(); hint.remove();
        var nb = el('button', { class: 'btn primary', type: 'button' }, i + 1 < N2 ? 'Next question' : 'See my score');
        nb.addEventListener('click', function () { i++; next(); window.scrollTo(0, 0); });
        R2.actions.innerHTML = ''; R2.actions.appendChild(nb); nb.focus({ preventScroll: true });
        dots();
      }
      check.addEventListener('click', doCheck);
      R2.box.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); doCheck(); } });
      R2.focusFirst();
    }
    function summary() {
      var sc = results.filter(function (r) { return r.ok; }).length, l = level(id);
      var msg = sc >= 9 ? 'Excellent. This topic is looking secure.' : sc >= 7 ? 'Good work. A little more practice will make it secure.' : sc >= 5 ? 'Getting there. Re-read the worked example, then try another set.' : 'Read through the key ideas and the worked example first, then have another go.';
      view.innerHTML = '<div class="stack"><div><button class="back" data-go="home">All topics</button></div><h1>' + t.title + '</h1><div class="sheet"><span class="score">' + sc + '/' + N2 + '</span><p>' + msg + '</p><div class="dots">' + results.map(function (r) { return '<i class="' + (r.ok ? 'ok' : 'no') + '"></i>'; }).join('') + '</div><p class="small">Topic status: ' + LEVELS[l] + '.' + (results.some(function (r) { return r.hinted; }) ? ' You used a hint on ' + results.filter(function (r) { return r.hinted; }).length + ' question' + (results.filter(function (r) { return r.hinted; }).length === 1 ? '' : 's') + '.' : '') + '</p></div><div class="row"><button class="btn primary" data-go="practise" data-id="' + id + '">Practise another 10</button><button class="btn" data-go="learn" data-id="' + id + '">Review key ideas</button><button class="btn quiet" data-go="home">All topics</button></div></div>';
      wireGo(); updateMast();
      var h = view.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    }
    shell(); next();
  }

  /* ---------- mixed test ---------- */
  function testSetup() {
    current = { name: 'testsetup' };
    var scope = 'all', len = 15;
    var h = '<div class="stack"><div><button class="back" data-go="home">All topics</button></div><h1>Mixed test</h1><p class="muted" style="max-width:65ch">Questions come from different topics, like an exam. You see your marks and worked solutions at the end.</p>';
    h += '<h2>What to cover</h2><div class="choice" role="radiogroup" aria-label="What to cover" id="scope"><button type="button" role="radio" aria-checked="true" data-v="all">All of Stage 7<span>' + TOPICS.length + ' topics</span></button>' + STRANDS.map(function (s) { return '<button type="button" role="radio" aria-checked="false" data-v="' + s.id + '">' + s.name + '<span>' + TOPICS.filter(function (t) { return t.strand === s.id; }).length + ' topics</span></button>'; }).join('') + '</div>';
    h += '<h2>How many questions</h2><div class="choice" role="radiogroup" aria-label="How many questions" id="len"><button type="button" role="radio" aria-checked="false" data-v="10">10 questions<span>About 15 minutes</span></button><button type="button" role="radio" aria-checked="true" data-v="15">15 questions<span>About 25 minutes</span></button><button type="button" role="radio" aria-checked="false" data-v="25">25 questions<span>About 40 minutes</span></button></div>';
    h += '<div class="row"><button class="btn primary" id="start">Start the test</button></div></div>';
    view.innerHTML = h; wireGo();
    function radio(gid, set) { var g = document.getElementById(gid); Array.prototype.forEach.call(g.children, function (b) { b.addEventListener('click', function () { Array.prototype.forEach.call(g.children, function (c) { c.setAttribute('aria-checked', c === b ? 'true' : 'false'); }); set(b.getAttribute('data-v')); }); }); }
    radio('scope', function (v) { scope = v; }); radio('len', function (v) { len = +v; });
    document.getElementById('start').addEventListener('click', function () { go(function () { runTest(scope, len); }); });
  }
  function runTest(scope, len) {
    current = { name: 'test' };
    var pool = TOPICS.filter(function (t) { return scope === 'all' || t.strand === scope; }).map(function (t) { return t.id; });
    var order = []; while (order.length < len) order = order.concat(shuffle(pool)); order = order.slice(0, len);
    var make = maker(pool), qs = order.map(function (id) { return make(id); }), resp = new Array(len), i = 0;
    view.innerHTML = '<div class="stack"><div class="practhead"><h1 style="font-size:1.35rem">Mixed test</h1><div class="dots" id="dots" aria-hidden="true"></div></div><p class="small" id="pcount"></p><div id="qhost"></div><div class="row"><button class="btn quiet" id="quit">Stop and mark what I have done</button></div></div>';
    document.getElementById('quit').addEventListener('click', finish);
    function dots() { var d = ''; for (var k = 0; k < len; k++) d += '<i class="' + (k === i ? 'cur' : resp[k] !== undefined ? 'done' : '') + '"></i>'; document.getElementById('dots').innerHTML = d; document.getElementById('pcount').textContent = 'Question ' + (i + 1) + ' of ' + len + '. Topic: ' + byId[qs[i]._topic].title + '.'; }
    function show() {
      if (i >= len) return finish();
      dots();
      var q = qs[i], R2 = renderQ(q, i + 1), host = document.getElementById('qhost'); host.innerHTML = ''; host.appendChild(R2.box);
      var nb = el('button', { class: 'btn primary', type: 'button' }, i + 1 < len ? 'Save and next' : 'Save and finish'), sk = el('button', { class: 'btn', type: 'button' }, 'Skip');
      R2.actions.appendChild(nb); R2.actions.appendChild(sk);
      function saveNext() {
        if (R2.empty()) { R2.after.innerHTML = '<p class="warn">Enter an answer, or choose Skip.</p>'; return; }
        resp[i] = R2.getResp(); i++; show(); window.scrollTo(0, 0);
      }
      nb.addEventListener('click', saveNext);
      sk.addEventListener('click', function () { resp[i] = null; i++; show(); window.scrollTo(0, 0); });
      R2.box.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); saveNext(); } });
      R2.focusFirst();
    }
    function finish() {
      var done = 0, score = 0, items = '', weak = {};
      qs.forEach(function (q, k) {
        if (resp[k] === undefined) return; done++;
        var r = resp[k], m = r === null ? { ok: false } : mark(q, r);
        if (m.ok) score++; else weak[q._topic] = (weak[q._topic] || 0) + 1;
        record(q._topic, m.ok);
        items += '<div class="rv"><div class="rvh"><span class="m ' + (m.ok ? 'ok' : 'no') + '" aria-label="' + (m.ok ? 'correct' : 'incorrect') + '">' + (m.ok ? '✓' : '✗') + '</span><b>Question ' + (k + 1) + '</b><span class="small">' + byId[q._topic].title + '</span></div><div class="prompt">' + q.prompt + '</div>' + (q.fig ? '<div class="figwrap">' + q.fig + '</div>' : '') + '<p><b>Your answer:</b> ' + (r === null ? 'skipped' : respText(q, r)) + '</p>' + (m.ok ? '' : '<p><b>Correct answer:</b> ' + q.ans + '</p>') + solutionHTML(q, false) + '</div>';
      });
      if (done) { prog.tests.push({ at: Date.now(), n: done, score: score, scope: scope }); prog.tests = prog.tests.slice(-12); save(); }
      var weakList = Object.keys(weak).sort(function (a, b) { return weak[b] - weak[a]; }).slice(0, 4);
      var h = '<div class="stack"><div><button class="back" data-go="home">All topics</button></div><h1>Test results</h1><div class="sheet"><span class="score">' + score + '/' + done + '</span><p>' + (done ? (score / done >= 0.8 ? 'A strong result.' : score / done >= 0.5 ? 'A solid base. Focus on the topics below.' : 'Work through the topics below one at a time, starting with the key ideas.') : 'You did not answer any questions, so there is nothing to mark.') + '</p></div>';
      if (weakList.length) h += '<h2>Topics to practise next</h2><div class="topics">' + weakList.map(function (id) { var t = byId[id]; return '<button class="trow" style="--sc:' + strandColor(t.strand) + '" data-go="topic" data-id="' + id + '"><span class="tt">' + t.title + '</span><span class="codes">' + weak[id] + ' wrong in this test</span><span class="st">' + meter(level(id), t.strand) + '<span class="stl" data-l="' + level(id) + '">' + LEVELS[level(id)] + '</span></span></button>'; }).join('') + '</div>';
      if (done) h += '<h2>Your answers</h2><div class="review">' + items + '</div>';
      h += '<div class="row"><button class="btn primary" data-go="test">Take another test</button><button class="btn quiet" data-go="home">All topics</button></div></div>';
      current = { name: 'testresults' };
      view.innerHTML = h; wireGo(); updateMast(); window.scrollTo(0, 0);
    }
    show();
  }

  /* ---------- footer: reset ---------- */
  var resetBtn = document.getElementById('reset'), confirmBox = document.getElementById('confirm');
  resetBtn.addEventListener('click', function () { confirmBox.hidden = false; resetBtn.hidden = true; });
  document.getElementById('nokeep').addEventListener('click', function () { confirmBox.hidden = true; resetBtn.hidden = false; });
  document.getElementById('yesreset').addEventListener('click', function () { prog = blank(); save(); confirmBox.hidden = true; resetBtn.hidden = false; go(home); });

  /* ---------- start ---------- */
  var startHash = (location.hash || '').replace('#', '');
  if (byId[startHash]) topicPage(startHash); else if (startHash === 'test') testSetup(); else home();
  updateMast();
})();
</script></body></html>
